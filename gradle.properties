org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Let Gradle fetch the JDK the build asks for when the machine does not already have one.
#
# The build targets Java 21. With this disabled, a machine without a JDK 21 fails before compiling
# anything, and the reason ("Cannot find a Java installation ... Toolchain auto-provisioning is not
# enabled") is buried inside a long stack trace, so the run looks broken rather than under-equipped.
# Enabled, any recent JDK is enough to start the build and the right one is fetched automatically.
org.gradle.java.installations.auto-download=true
